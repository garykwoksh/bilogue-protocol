name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run security regression tests (99 tests, v0.3.3)
      run: |
        python3 test_relay_security.py --port $((8000 + RANDOM % 1000))

    - name: Run fuzz suite (P2-04, 500 iters, must stay alive & 0 crashes)
      run: |
        python3 fuzz_relay.py --iters 500 --port $((7000 + RANDOM % 1000))

    - name: Run MVP demo (mock mode)
      run: |
        python3 hello_bilogue.py --mock --auto-approve
